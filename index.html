
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Restock System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
            background-color: #f1f5f9;
        }

        h1 {
            color: #2563eb;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        form input {
            display: block;
            width: 95%;
        }

        button {
            padding: 9px 12px;
            margin: 5px 2px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            background: #dc2626;
        }

        .status {
            font-weight: bold;
        }

        .out {
            color: red;
        }

        .low {
            color: #b45309;
        }

        .available {
            color: green;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e2e8f0;
        }

        #message {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                margin: 10px;
            }

            section {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <h1>Inventory Restock System</h1>
    <section>
        <h2>Add Product</h2>

        <form id="productForm">
            <label for="name">Product Name</label>
            <input type="text" id="name" required>

            <label for="category">Category</label>
            <input type="text" id="category" required>

            <label for="price">Price</label>
            <input type="number" id="price" min="0" step="any" required>

            <label for="stock">Stock Quantity</label>
            <input type="number" id="stock" min="0" step="1" required>

            <button type="submit">Add Product</button>
        </form>
    </section>

    <section>
        <h2>Search Product</h2>

        <label for="searchId">Product ID</label>
        <input type="number" id="searchId" min="1">

        <button type="button" id="searchBtn">Search</button>
        <button type="button" id="showAllBtn">Show All</button>

        <div id="searchResult"></div>
    </section>

    <section>
        <h2>Product Inventory</h2>

        <button type="button" id="refreshBtn">Refresh</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="productTable"></tbody>
            </table>
        </div>
    </section>

    <p id="message"></p>

    <script>
        const API = "/api/products";

        const form = document.getElementById("productForm");
        const table = document.getElementById("productTable");
        const message = document.getElementById("message");

        // Show a message to the user
        function showMessage(text, error = false) {
            message.textContent = text;
            message.style.color = error ? "red" : "green";
        }

        // Get the status based on stock quantity
        function getStatus(stock) {
            if (stock === 0) {
                return "OUT OF STOCK";
            }

            if (stock <= 5) {
                return "LOW STOCK";
            }

            return "AVAILABLE";
        }

        // Set the color of the stock status
        function getStatusClass(status) {
            if (status === "OUT OF STOCK") {
                return "out";
            }

            if (status === "LOW STOCK") {
                return "low";
            }

            return "available";
        }

        // Escape text before displaying it in HTML
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        // GET: Display all products
        async function loadProducts() {
            try {
                const response = await fetch(API);
                const products = await response.json();

                if (!response.ok) {
                    throw new Error(products.message);
                }

                table.innerHTML = "";

                if (products.length === 0) {
                    table.innerHTML =
                        '<tr><td colspan="7">No products found.</td></tr>';
                    return;
                }

                products.forEach(product => {
                    const status = product.stock_status ||
                        getStatus(product.stock);

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${product.id}</td>
                        <td>${escapeHTML(product.product_name)}</td>
                        <td>${escapeHTML(product.category)}</td>
                        <td>${Number(product.price).toFixed(2)}</td>
                        <td>${product.stock}</td>
                        <td class="status ${getStatusClass(status)}">
                            ${status}
                        </td>
                        <td>
                            <button class="delete-btn"
                                data-id="${product.id}">
                                Delete
                            </button>
                        </td>
                    `;

                    table.appendChild(row);
                });
            } catch (error) {
                showMessage("Failed to load products.", true);
            }
        }

        // POST: Add a new product
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const category = document.getElementById("category").value.trim();
            const priceValue = document.getElementById("price").value;
            const stockValue = document.getElementById("stock").value;

            const price = Number(priceValue);
            const stock = Number(stockValue);

            if (!name || !category) {
                showMessage("Enter the product name and category.", true);
                return;
            }

            if (priceValue === "" || !Number.isFinite(price) || price < 0) {
                showMessage("Price cannot be negative.", true);
                return;
            }

            if (stockValue === "" ||
                !Number.isSafeInteger(stock) || stock < 0) {
                showMessage("Stock must be a non-negative whole number.", true);
                return;
            }

            const product = {
                product_name: name,
                category: category,
                price: price,
                stock: stock
            };

            try {
                const response = await fetch(API, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(product)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message);
                }

                form.reset();
                document.getElementById("searchResult").innerHTML = "";

                showMessage(
                    data.message + " Status: " + data.product.stock_status
                );

                loadProducts();
            } catch (error) {
                showMessage(error.message || "Failed to add product.", true);
            }
        });

        // GET: Search for a product by ID
        async function searchProduct() {
            const id = document.getElementById("searchId").value;
            const result = document.getElementById("searchResult");

            if (!id || !Number.isSafeInteger(Number(id)) || Number(id) < 1) {
                result.textContent = "Enter a valid product ID.";
                return;
            }

            try {
                const response = await fetch(`${API}/${id}`);
                const product = await response.json();

                if (!response.ok) {
                    throw new Error(product.message);
                }

                const status = product.stock_status ||
                    getStatus(product.stock);

                result.innerHTML = `
                    <h3>Product Details</h3>
                    <p>ID: ${product.id}</p>
                    <p>Name: ${escapeHTML(product.product_name)}</p>
                    <p>Category: ${escapeHTML(product.category)}</p>
                    <p>Price: ${Number(product.price).toFixed(2)}</p>
                    <p>Stock: ${product.stock}</p>
                    <p>Status:
                        <span class="status ${getStatusClass(status)}">
                            ${status}
                        </span>
                    </p>
                `;
            } catch (error) {
                result.textContent = error.message || "Product not found.";
            }
        }

        document.getElementById("searchBtn").addEventListener(
            "click", searchProduct
        );

        // Allow Enter to search
        document.getElementById("searchId").addEventListener(
            "keydown", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    searchProduct();
                }
            }
        );

        // DELETE: Remove a product
        table.addEventListener("click", async function(event) {
            const button = event.target.closest(".delete-btn");

            if (!button) {
                return;
            }

            const id = button.dataset.id;

            if (!confirm("Are you sure you want to delete this product?")) {
                return;
            }

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message);
                }

                document.getElementById("searchResult").innerHTML = "";
                showMessage(data.message);
                loadProducts();
            } catch (error) {
                showMessage(error.message || "Failed to delete product.", true);
            }
        });

        // Show all products
        document.getElementById("showAllBtn").addEventListener(
            "click", function() {
                document.getElementById("searchId").value = "";
                document.getElementById("searchResult").innerHTML = "";
                loadProducts();
            }
        );

        // Refresh the inventory
        document.getElementById("refreshBtn").addEventListener(
            "click", loadProducts
        );

        loadProducts();
    </script>
</body>
</html>
